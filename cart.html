<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoreFront - My Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="flex h-screen bg-gray-50 text-gray-900 overflow-hidden">
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0"
    >
      <header class="p-6 flex items-center gap-3">
        <a
          href="index.html"
          class="w-10 h-10 bg-indigo-500 rounded-xl hover:bg-indigo-600 shadow-md flex items-center justify-center text-white font-bold text-xl transition"
        >
          S
        </a>
        <a href="index.html" class="text-xl font-bold">StoreFront</a>
      </header>
    </aside>

    <main class="flex-1 flex flex-col bg-gray-50 overflow-hidden">
      <nav
        class="h-16 bg-white border-b border-gray-100 flex items-center px-8 sticky top-0 z-20 shrink-0"
      >
        <a
          href="index.html"
          class="ml-auto text-sm font-medium text-gray-400 hover:text-indigo-600 transition flex items-center gap-2"
        >
          <span>←</span> Continue Shopping
        </a>
      </nav>

      <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-2xl mx-auto w-full">
          <div class="mb-8 flex items-center justify-between">
            <div>
              <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
                Your Cart
              </h1>
              <p class="text-gray-500 mt-2">
                Review your items before checkout
              </p>
            </div>

            <button
              onclick="clearAllCart()"
              class="text-sm font-medium text-white hover:text-red-600 transition flex items-center gap-2 bg-red-500 hover:bg-red-200 px-4 py-2 rounded-xl active:scale-95"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                />
              </svg>
              Clear Cart
            </button>
          </div>

          <div id="cart-items-container" class="space-y-4 mb-10"></div>

          <div
            class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200 w-full mb-10"
          >
            <h2 class="text-xl font-bold mb-6 text-center">Order Summary</h2>

            <div class="space-y-4 border-b border-gray-100 pb-6 mb-6">
              <div class="flex justify-between text-gray-600">
                <span>Subtotal</span>
                <span id="subtotal" class="font-bold text-gray-900">$0.00</span>
              </div>
              <div class="flex justify-between text-gray-600">
                <span>Shipping Estimate</span>
                <span class="text-emerald-600 font-medium italic"
                  >Free Shipping</span
                >
              </div>
            </div>

            <div
              class="flex justify-between items-center text-2xl font-black mb-8"
            >
              <span>Total</span>
              <span id="total-price" class="text-indigo-600">$0.00</span>
            </div>

            <button
              class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100 active:scale-[0.98]"
            >
              Complete Checkout
            </button>
          </div>
        </div>
      </div>
      <footer class="mt-8 p-6 border-t border-gray-200">
        <div
          class="flex flex-col md:flex-row justify-between items-center gap-4"
        >
          <div class="flex flex-col gap-1">
            <a href="/" class="text-xl font-bold">StoreFront</a>
            <p class="text-xs text-gray-400">
              © 2026 All Rights Reserved. Designed by mugeylmz.
            </p>
          </div>

          <div class="flex items-center gap-6">
            <a
              href="#"
              class="text-xs font-semibold text-gray-400 hover:text-indigo-600 transition duration-300"
              >Privacy Policy</a
            >
            <a
              href="#"
              class="text-xs font-semibold text-gray-400 hover:text-indigo-600 transition duration-300"
              >Terms of Service</a
            >
            <a
              href="#"
              class="text-xs font-semibold text-gray-400 hover:text-indigo-600 transition duration-300"
              >Support</a
            >
          </div>

          <div class="flex flex-col items-center md:items-end gap-2">
            <span class="text-sm font-semibold text-gray-400 tracking-wide"
              >Follow Us:</span
            >
            <div class="flex items-center gap-3">
              <a
                href="https://linkedin.com/in/"
                target="_blank"
                class="p-2 bg-gray-100 text-gray-500 rounded-lg hover:bg-indigo-200 hover:text-indigo-700 transition duration-300 shadow-sm"
              >
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
                  />
                </svg>
              </a>

              <a
                href="https://instagram.com/"
                target="_blank"
                class="p-2 bg-gray-100 text-gray-500 rounded-lg hover:bg-rose-200 hover:text-rose-700 transition duration-300 shadow-sm"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                  <path
                    d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"
                  ></path>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
              </a>

              <a
                href="https://github.com/"
                target="_blank"
                class="p-2 bg-gray-100 text-gray-500 rounded-lg hover:bg-gray-500 hover:text-white transition duration-300 shadow-sm"
              >
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                  />
                </svg>
              </a>
            </div>
          </div>
        </div>
      </footer>
    </main>

    <script src="cart.js"></script>
  </body>
</html>
