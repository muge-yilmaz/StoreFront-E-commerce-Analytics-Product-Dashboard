<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoreFront - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">
    <div
      class="max-w-md w-full bg-white rounded-[2.5rem] shadow-xl shadow-indigo-100/50 border border-gray-100 p-10"
    >
      <div class="text-center mb-10">
        <div
          class="w-16 h-16 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4 shadow-lg shadow-indigo-200"
        >
          S
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome!</h1>
        <p class="text-gray-400 mt-2 text-sm">Please sign in to your account</p>
      </div>

      <form id="login-form" class="space-y-6">
        <div>
          <label
            class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1"
            >Full Name</label
          >
          <input
            type="text"
            id="full-name"
            required
            placeholder="Ex: John Doe"
            class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200"
          />
        </div>

        <div>
          <label
            class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1"
            >E-Mail</label
          >
          <input
            type="email"
            id="email"
            required
            placeholder="ex@sample.com"
            class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200"
          />
        </div>

        <div>
          <label
            class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
            class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200"
          />
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-500 cursor-pointer">
            <input
              type="checkbox"
              class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
            />
            Remember Me
          </label>
          <a href="#" class="text-indigo-600 font-semibold hover:underline"
            >Forgot Password</a
          >
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 active:scale-[0.98]"
        >
          Sign In
        </button>
      </form>

      <p class="text-center mt-8 text-sm text-gray-500">
        Don't have an account?
        <a href="#" class="text-indigo-600 font-bold hover:underline"
          >Sign Up for Free</a
        >
      </p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
